services:
  postgres:
    image: postgres:17
    container_name: authcore-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: authcore
      POSTGRES_PASSWORD: authcore
      POSTGRES_DB: authcore

    ports:
      - '5433:5432'

    volumes:
      - authcore-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U authcore -d authcore']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  authcore-postgres-data:
