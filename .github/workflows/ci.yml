name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: authcore
          POSTGRES_PASSWORD: authcore
          POSTGRES_DB: authcore
        ports:
          - 5433:5432

        options: >-
          --health-cmd="pg_isready -U authcore -d authcore"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://authcore:authcore@localhost:5433/authcore
      JWT_ISSUER: authcore
      JWT_ACCESS_TOKEN_TTL: 10m
      JWT_REFRESH_TOKEN_TTL: 30d
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run migrations
        run: npx prisma migrate deploy

      - name: Unit tests
        run: npm test -- --runInBand

      - name: E2E tests
        run: npm run test:e2e -- --runInBand

      - name: Build
        run: npm run build
